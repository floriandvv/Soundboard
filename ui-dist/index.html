<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DnD Soundboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    input[type="range"] { accent-color: #22c55e; }
    .tabular { font-variant-numeric: tabular-nums; }
    .shadow-glow { box-shadow: 0 10px 30px -14px rgba(34,197,94,.45); }
    .card { background: rgba(15,23,42,.55); border: 1px solid rgba(51,65,85,.8); }
    .cardHeader { background: linear-gradient(90deg, rgba(15,23,42,.9), rgba(15,23,42,.35)); border-bottom: 1px solid rgba(51,65,85,.8); }
    .btn { border: 1px solid rgba(51,65,85,.9); background: rgba(30,41,59,.55); }
    .btn:hover { background: rgba(30,41,59,.8); }
    .btnPrimary { background: rgba(34,197,94,.9); border-color: rgba(34,197,94,.9); color: #052e16; }
    .btnPrimary:hover { background: rgba(34,197,94,1); }
    .btnDanger { background: rgba(239,68,68,.92); border-color: rgba(239,68,68,.92); color: #1f0a0a; }
    .btnDanger:hover { background: rgba(239,68,68,1); }
    .chip { background: rgba(30,41,59,.7); border: 1px solid rgba(51,65,85,.7); }
    .sceneActive { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.55); }
    .sceneItem { background: rgba(15,23,42,.25); border: 1px solid rgba(51,65,85,.7); }
    .sceneItem:hover { background: rgba(15,23,42,.55); }
    .pad { border-radius: 18px; color: white; font-weight: 800; }
    .padSmall { font-size: 12px; font-weight: 700; }
    .menu { background: rgba(15,23,42,.96); border: 1px solid rgba(51,65,85,.9); }
    .kmono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    :focus-visible { outline: 2px solid #34d399; outline-offset: 2px; }
    button, input, select { min-height: 2.25rem; }
    .ambienceToggle { min-height: 0 !important; height: 20px; width: 40px; padding: 0; line-height: 1; }
    .ambienceToggleKnob { min-height: 0 !important; height: 16px; width: 16px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
    .dialogBackdrop { background: rgba(2,6,23,.72); }
    .setupField { margin-top: .75rem; }
    .setupField:focus { outline: 1px solid rgba(52,211,153,.8); outline-offset: 2px; box-shadow: 0 0 0 2px rgba(52,211,153,.12); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="app" class="min-h-screen"></div>

  <script>
    // ==============================================================
    // DnD Soundboard (single-file UI)
    // - Served by Python FastAPI server
    // - Fetches games/library/scenes from /api
    // - Music: Playlist (A)
    // - Ambience: Layers with per-layer fade (C, no lowpass)
    // - SFX: Big colored pads with per-pad color picker
    // Audio Playback:
    // - Music & Ambience are streamed via <audio> elements and routed
    //   into WebAudio via createMediaElementSource.
    // - SFX: AudioBuffer-based, preloaded per scene (low-latency, polyphonic).
    // ============================================================== 

    const state = {
      // injected later
    };

    // ---------------------- Localization ----------------------
    // Translations are loaded from the external language.json file.
    let supportedLanguages = ['de', 'en'];
    let languageLabels = { de: 'Deutsch', en: 'English' };
    const fallbackTranslations = {
      de: {
        language: 'Sprache', english: 'Englisch', german: 'Deutsch',
        libraryColon: 'Bibliothek: ', gameColon: 'Spiel: ',
        lanConnected: '● LAN verbunden', lanDisconnected: '● Getrennt',
        library: 'Bibliothek', game: 'Spiel', scene: 'Szene', scenes: 'Szenen',
        new: 'Neu', create: 'Erstellen', rename: 'Umbenennen', duplicate: 'Duplizieren',
        delete: 'Löschen', close: 'Schließen', open: 'Öffnen', save: 'Speichern', cancel: 'Abbrechen',
        builder: 'Spiel zusammenstellen', closeBuilder: 'Zusammenstellung schließen',
        music: 'Musik', ambience: 'Ambience', sfx: 'SFX',
        audioEnable: 'Audio aktivieren', audioActive: 'Audio aktiv', audioLocked: 'Audio gesperrt',
        newShort: '+ Neu',
        connected: 'Verbunden', disconnected: 'Getrennt', master: 'MASTER',
        ready: 'bereit', off: 'aus', playing: 'spielt', loadingShort: 'lädt…', unavailable: 'nicht verfügbar', available: 'bereit', notLoaded: 'nicht geladen',
        nowPlaying: 'Wird gerade abgespielt', play: 'Wiedergabe', pause: 'Pause', stop: 'Stopp',
        crossfade: 'Crossfade', loop: 'Loop', title: 'Titel', playlist: 'Playlist',
        addFromLibrary: 'Aus Bibliothek hinzufügen', librarySearch: 'Bibliothek durchsuchen',
        chooseAssets: 'Assets für dieses Spiel auswählen',
        chooseAssetsHint: 'Hier wählst du nur die verfügbaren Titel. Loop, Lautstärke und Wiedergabeoptionen stellst du später in den Szenen ein.',
        noAssets: 'Keine Assets in diesem Spiel.', loading: 'Wird geladen…',
        createLibrary: 'Bibliothek erstellen', libraryName: 'Bibliotheksname',
        libraryNamePlaceholder: 'Bibliotheksname, z. B. Meine Sounds',
        gameNamePlaceholder: 'Spielname, z. B. Cyberpunk',
        firstLibrary: 'Erstelle deine erste Bibliothek',
        firstLibraryHint: 'Gib deiner Bibliothek einen Namen. Die Audio-Ordner werden automatisch angelegt, damit du direkt Titel hinzufügen kannst.',
        afterCreate: 'Danach kannst du Musik-, Ambience- und SFX-Dateien hinzufügen.',
        newGroup: '+ Neue Gruppe', editGroup: 'Gruppe bearbeiten', deleteGroup: 'Gruppe löschen', assignGroup: 'Gruppe zuweisen', groupActions: 'Gruppenaktionen',
        moveUp: 'Nach oben', moveDown: 'Nach unten', fadeStop: 'Fade stoppen', emergencyStop: 'Notstopp'
      },
      en: {
        language: 'Language', english: 'English', german: 'German',
        libraryColon: 'Library: ', gameColon: 'Game: ',
        lanConnected: '● LAN connected', lanDisconnected: '● Disconnected',
        library: 'Library', game: 'Game', scene: 'Scene', scenes: 'Scenes',
        new: 'New', create: 'Create', rename: 'Rename', duplicate: 'Duplicate',
        delete: 'Delete', close: 'Close', open: 'Open', save: 'Save', cancel: 'Cancel',
        builder: 'Build game', closeBuilder: 'Close builder',
        music: 'Music', ambience: 'Ambience', sfx: 'SFX',
        audioEnable: 'Enable audio', audioActive: 'Audio active', audioLocked: 'Audio locked',
        newShort: '+ New',
        connected: 'Connected', disconnected: 'Disconnected', master: 'MASTER',
        ready: 'ready', off: 'off', playing: 'playing', loadingShort: 'loading…', unavailable: 'unavailable', available: 'ready', notLoaded: 'not loaded',
        nowPlaying: 'Now playing', play: 'Play', pause: 'Pause', stop: 'Stop',
        crossfade: 'Crossfade', loop: 'Loop', title: 'Title', playlist: 'Playlist',
        addFromLibrary: 'Add from library', librarySearch: 'Search library',
        chooseAssets: 'Choose assets for this game',
        chooseAssetsHint: 'Choose the available titles here. Configure looping, volume and playback options later in the scenes.',
        noAssets: 'No assets in this game.', loading: 'Loading…',
        createLibrary: 'Create library', libraryName: 'Library name',
        firstLibrary: 'Create your first library',
        firstLibraryHint: 'Give your library a name. The audio folders will be created automatically so you can start adding titles.',
        afterCreate: 'Afterwards you can add Music, Ambience and SFX files.',
        newGroup: '+ New group', editGroup: 'Edit group', deleteGroup: 'Delete group', assignGroup: 'Assign group', groupActions: 'Group actions',
        moveUp: 'Move up', moveDown: 'Move down', fadeStop: 'Fade stop', emergencyStop: 'Emergency stop'
      }
    };
    let translations = fallbackTranslations;
    let translationsReady = false;
    state.language = (document.documentElement.lang || 'de').toLowerCase().startsWith('en') ? 'en' : 'de';
    async function loadTranslations() {
      try {
        const response = await fetch('/language.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        supportedLanguages = data.supportedLanguages || supportedLanguages;
        languageLabels = data.labels || languageLabels;
        translations = data.translations || fallbackTranslations;
        if (!supportedLanguages.includes(state.language)) state.language = supportedLanguages[0] || 'de';
        translationsReady = true;
        render();
      } catch (error) {
        console.error('Sprachdatei konnte nicht geladen werden:', error);
        render();
      }
    }
    function t(key, vars = {}) {
      const source = translations[state.language] || translations.translations?.[state.language] || {};
      const fallback = translations.en || translations.translations?.en || fallbackTranslations.en || {};
      if (source.translations) Object.assign(source, source.translations);
      let value = source[key] ?? fallback[key] ?? key;
      return String(value).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? '');
    }
    function setLanguage(language) {
      if (!supportedLanguages.includes(language) || !translations[language]) return;
      state.language = language;
      document.documentElement.lang = language;
      render();
    }

    // Admin token (optional): stored in-memory only (no localStorage in this environment).
    let ADMIN_TOKEN = '';

    async function apiFetch(url, opts={}) {
      const headers = Object.assign({}, opts.headers || {});
      if (ADMIN_TOKEN) headers['X-Admin-Token'] = ADMIN_TOKEN;
      const res = await fetch(url, Object.assign({}, opts, { headers }));
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch {}
      if (!res.ok) {
        const detail = json && json.detail != null ? json.detail : (json && json.message != null ? json.message : null);
        const msg = typeof detail === 'object'
          ? [detail.field, detail.message || detail.code || JSON.stringify(detail)].filter(Boolean).join(': ')
          : (detail || `${res.status} ${res.statusText}`);
        throw new Error(String(msg));
      }
      return json;
    }

    const API = {
      health: () => apiFetch('/api/health'),
      games: () => apiFetch('/api/games'),
      createGame: (payload) => apiFetch('/api/games', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
      library: (gameId, sessionId=null) => apiFetch(`/api/library?game_id=${encodeURIComponent(gameId)}${sessionId ? `&session_id=${encodeURIComponent(sessionId)}` : ''}`),
      scenes: (gameId, sessionId=null) => apiFetch(`/api/scenes?game_id=${encodeURIComponent(gameId)}${sessionId ? `&session_id=${encodeURIComponent(sessionId)}` : ''}`),
      upsertScene: (scene) => apiFetch('/api/scenes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(scene) }),
      deleteScene: (id) => apiFetch(`/api/scenes/${encodeURIComponent(id)}`, { method: 'DELETE' }),
      sessions: (gameId) => apiFetch(`/api/sessions?game_id=${encodeURIComponent(gameId)}`),
      createSession: (payload) => apiFetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
      deleteSession: (id) => apiFetch(`/api/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' }),
      sessionAssets: (sessionId) => apiFetch(`/api/sessions/${encodeURIComponent(sessionId)}/assets`),
      upsertSessionAssets: (sessionId, payload) => apiFetch(`/api/sessions/${encodeURIComponent(sessionId)}/assets`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
      removeSessionAsset: (sessionId, assetId) => apiFetch(`/api/sessions/${encodeURIComponent(sessionId)}/assets/${encodeURIComponent(assetId)}`, { method: 'DELETE' }),
      renameSession: (sessionId, payload) => apiFetch(`/api/sessions/${encodeURIComponent(sessionId)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
      reorderScene: (sceneId, order) => apiFetch(`/api/scenes/${encodeURIComponent(sceneId)}/order`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order }) }),
      deleteScene: (id) => apiFetch(`/api/scenes/${encodeURIComponent(id)}`, { method: 'DELETE' }),
      duplicateSession: (sessionId, payload={}) => apiFetch(`/api/sessions/${encodeURIComponent(sessionId)}/duplicate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
    };

    // ==============================================================
    // DnD Soundboard (single-file UI)
    // ... (rest of file keeps using `state` defined below)
    // ==============================================================

    // ---------------------- App State ----------------------
    Object.assign(state, {
      connected: false,
      games: [],
      activeGameId: null,
      sessions: [],
      activeSessionId: null,
      sessionAssets: [], // [{asset_id, preload, volume_db, loop, sort_order}]
      library: null,
      scenes: [],
      activeSceneId: null,
      ui: { busy: false, toast: null, sessionBuilderOpen: false, builderQuery: '', fullLibraryOpen: false, fullLibraryBucket: 'SFX', fullLibraryQuery: '', fullLibrary: null, selectedSessionAssets: new Set(), fullLibrarySelected: new Set(), draggingSessionAsset: null, sessionDirty: false, mobileSidebarOpen: false, searchTimers: new Map(), dialog: null, setupGameName: '', openSfxPadMenu: null },
      audio: {
        unlocked: false,
        ctx: null,
        master: { gain: null, db: -10 },
        buses: {
          music: { gain: null, db: -14 },
          ambience: { gain: null, db: -16 },
          sfx: { gain: null, db: -6 },
        },
        music: {
          crossfadeSec: 4,
          node: null,
          status: 'idle',
          error: null,
          armed: false,
          loopMode: 'off', // off | track | playlist
          loop: false, // legacy alias for track looping
        },
        ambience: {
          nodes: new Map(),
          status: new Map(),
          errors: new Map(),
        },
        sfx: {
          cache: new Map(),
          loading: new Set(),
          status: new Map(),
          errors: new Map(),
          playing: new Set(),
          voices: new Map(),
          allVoices: new Set(),
        },
        pendingSaves: new Map(),
        ducking: { enabled: true, active: false, voiceCount: 0, amountDb: -8, releaseMs: 500, releaseTimer: null }
      }
    });

    function captureFocusState() {
      const active = document.activeElement;
      if (!active || !['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName)) return null;
      const stateInfo = {
        tag: active.tagName,
        type: active.getAttribute('type') || '',
        placeholder: active.getAttribute('placeholder') || '',
        ariaLabel: active.getAttribute('aria-label') || '',
        focusKey: active.getAttribute('data-focus-key') || '',
        value: active.value,
        start: typeof active.selectionStart === 'number' ? active.selectionStart : null,
        end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
      };
      if (active.matches('[data-dialog-input]') && state.ui.dialog) state.ui.dialog.value = active.value;
      return stateInfo;
    }

    function restoreFocusState(info) {
      if (!info) return;
      const candidates = Array.from(document.querySelectorAll('input, textarea, select'));
      const target = candidates.find(node =>
        node.tagName === info.tag &&
        (node.getAttribute('type') || '') === info.type &&
        (node.getAttribute('placeholder') || '') === info.placeholder &&
        (node.getAttribute('aria-label') || '') === info.ariaLabel &&
        (!info.focusKey || node.getAttribute('data-focus-key') === info.focusKey)
      );
      if (!target) return;
      // Do not restore a stale DOM value for range inputs. Their value is
      // controlled by the current audio state, and restoring the old value
      // could make an unrelated render overwrite a slider during interaction.
      if (target.tagName !== 'SELECT' && target.type !== 'range') target.value = info.value;
      target.focus({ preventScroll: true });
      if (info.start != null && typeof target.setSelectionRange === 'function') {
        try { target.setSelectionRange(info.start, info.end); } catch {}
      }
    }

    function toast(msg, kind='info') {
      state.ui.toast = { msg, kind, t: Date.now() };
      render();
      setTimeout(() => { if (state.ui.toast && Date.now() - state.ui.toast.t > 2500) { state.ui.toast = null; render(); } }, 2600);
    }

    function scheduleSearch(key, value, apply) {
      const timers = state.ui.searchTimers;
      clearTimeout(timers.get(key));
      timers.set(key, setTimeout(() => {
        timers.delete(key);
        apply(value);
        render();
      }, 220));
    }

    function openDialog(config) {
      state.ui.dialog = config;
      render();
      setTimeout(() => {
        const input = document.querySelector('[data-dialog-input]');
        if (input) {
          input.focus({ preventScroll: true });
          if (typeof input.setSelectionRange === 'function') input.setSelectionRange(input.value.length, input.value.length);
        }
      }, 0);
    }

    function closeDialog() {
      state.ui.dialog = null;
      render();
    }

    function renderDialog() {
      const dialog = state.ui.dialog;
      if (!dialog) return null;
      const submit = () => {
        const input = document.querySelector('[data-dialog-input]');
        const value = input ? input.value.trim() : '';
        const color = document.querySelector('[data-dialog-color]')?.value || '';
        if (dialog.requireValue && !value) return;
        closeDialog();
        dialog.onSubmit?.(value, color);
      };
      const backdrop = el('div', { class: 'fixed inset-0 z-[70] dialogBackdrop flex items-center justify-center p-4', role: 'presentation', onMouseDown: (e) => { if (e.target === e.currentTarget) closeDialog(); } }, [
        el('div', { class: 'card rounded-2xl w-full max-w-md p-5 shadow-2xl', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dialog-title', onMouseDown: (e) => e.stopPropagation(), onClick: (e) => e.stopPropagation() }, [
          el('h2', { id: 'dialog-title', class: 'text-lg font-extrabold', text: dialog.title }),
          dialog.message ? el('p', { class: 'mt-2 text-sm text-slate-300', text: dialog.message }) : null,
          dialog.select ? el('select', { 'data-dialog-input': '1', class: 'mt-4 w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm', value: dialog.value || '', onMouseDown: (e) => e.stopPropagation(), onKeydown: (e) => { e.stopPropagation(); if (e.key === 'Escape') closeDialog(); } }, (dialog.options || []).map(option => el('option', { value: option.value, text: option.label, selected: option.value === dialog.value }))) : null,
          dialog.input ? el('input', { type: 'text', 'data-dialog-input': '1', autocomplete: 'off', spellcheck: false, class: 'mt-4 w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm', value: dialog.value || '', placeholder: dialog.placeholder || '', onMouseDown: (e) => e.stopPropagation(), onKeydown: (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); submit(); } if (e.key === 'Escape') closeDialog(); } }) : null,
          dialog.color ? el('input', { type: 'color', 'data-dialog-color': '1', class: 'mt-4 h-10 w-full rounded-lg bg-slate-950 border border-slate-700', value: dialog.color, onMouseDown: (e) => e.stopPropagation() }) : null,
          el('div', { class: 'mt-5 flex justify-end gap-2' }, [
            el('button', { type: 'button', class: 'px-3 py-2 rounded-lg btn text-sm font-semibold', text: t('cancel'), onClick: closeDialog }),
            el('button', { type: 'button', class: 'px-3 py-2 rounded-lg ' + (dialog.danger ? 'btnDanger' : 'btnPrimary') + ' text-sm font-semibold', text: dialog.confirmText || 'Confirm', onClick: submit })
          ])
        ])
      ]);
      return backdrop;
    }

    const SWATCHES = ['#ef4444','#f97316','#eab308','#22c55e','#0ea5e9','#3b82f6','#a855f7','#ec4899','#64748b'];

    const $ = (sel, root=document) => root.querySelector(sel);
    const el = (tag, attrs={}, kids=[]) => {
      const n = document.createElement(tag);
      for (const [k,v] of Object.entries(attrs)) {
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k === 'html') n.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
        else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v === true) n.setAttribute(k,'');
        else if (v !== false && v != null) n.setAttribute(k, v);
      }
      for (const c of (Array.isArray(kids) ? kids : [kids])) n.append(c?.nodeType ? c : document.createTextNode(c ?? ''));
      // Set form values after children exist. Setting `value` as an attribute
      // before <option> elements are appended does not reliably update the
      // selected option in native <select> controls.
      if (Object.prototype.hasOwnProperty.call(attrs, 'value') && 'value' in n) n.value = attrs.value == null ? '' : String(attrs.value);
      if (Object.prototype.hasOwnProperty.call(attrs, 'checked') && 'checked' in n) n.checked = Boolean(attrs.checked);
      if (Object.prototype.hasOwnProperty.call(attrs, 'selected') && 'selected' in n) n.selected = Boolean(attrs.selected);
      return n;
    };

    const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
    const dbToGain = (db) => Math.pow(10, db/20);

    function setAssetStatus(bucket, assetId, status, error=null) {
      const target = state.audio[bucket];
      if (!target?.status) return;
      target.status.set(assetId, status);
      if (target.errors) {
        if (error) target.errors.set(assetId, error);
        else target.errors.delete(assetId);
      }
      render();
    }

    function scheduleSceneSave(scene, key='scene') {
      const pending = state.audio.pendingSaves;
      clearTimeout(pending.get(key));
      pending.set(key, setTimeout(() => {
        pending.delete(key);
        saveScene(scene, { quiet: true });
      }, 450));
    }

    function setDucking(active) {
      const duck = state.audio.ducking;
      if (!duck.enabled) active = false;
      if (!state.audio.ctx) {
        duck.active = active;
        render();
        return;
      }
      const targetDb = active ? duck.amountDb : 0;
      for (const bus of ['music', 'ambience']) {
        const node = state.audio.buses[bus].gain;
        if (!node) continue;
        const ctx = state.audio.ctx;
        node.gain.cancelScheduledValues(ctx.currentTime);
        node.gain.linearRampToValueAtTime(dbToGain(state.audio.buses[bus].db + targetDb), ctx.currentTime + 0.04);
      }
      duck.active = active;
      render();
    }

    function beginSfxDucking() {
      const duck = state.audio.ducking;
      duck.voiceCount += 1;
      if (duck.releaseTimer) clearTimeout(duck.releaseTimer);
      setDucking(true);
    }

    function endSfxDucking() {
      const duck = state.audio.ducking;
      duck.voiceCount = Math.max(0, duck.voiceCount - 1);
      if (duck.voiceCount > 0) return;
      if (duck.releaseTimer) clearTimeout(duck.releaseTimer);
      duck.releaseTimer = setTimeout(() => {
        duck.releaseTimer = null;
        setDucking(false);
      }, duck.releaseMs);
    }

    function stopAllAudio({ panicStop=false } = {}) {
      if (!state.audio.ctx) return;
      const ctx = state.audio.ctx;
      const fade = panicStop ? 0.01 : 0.5;
      const current = state.audio.music.node;
      state.audio.music.node = null;
      state.audio.music.status = 'idle';
      if (current) stopAndDisconnect(current, fade);
      for (const [id, node] of state.audio.ambience.nodes) {
        stopAndDisconnect(node, fade);
        state.audio.ambience.status.set(id, 'idle');
      }
      state.audio.ambience.nodes.clear();
      state.audio.ducking.voiceCount = 0;
      if (state.audio.ducking.releaseTimer) clearTimeout(state.audio.ducking.releaseTimer);
      state.audio.ducking.releaseTimer = null;
      if (state.audio.ducking.active) setDucking(false);
      stopAllSfx({ fadeSec: panicStop ? 0.01 : 0.05 });
      if (panicStop) {
        state.audio.master.gain.gain.cancelScheduledValues(ctx.currentTime);
        state.audio.master.gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        setTimeout(() => setMasterDb(state.audio.master.db), 180);
      }
      render();
    }

    // ---------------------- Legacy state block removed ----------------------

    // ---------------------- Audio Engine ----------------------
    function ensureAudio() {
      if (state.audio.ctx) return state.audio.ctx;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = dbToGain(state.audio.master.db);
      master.connect(ctx.destination);
      state.audio.master.gain = master;

      for (const k of ['music','ambience','sfx']) {
        const g = ctx.createGain();
        g.gain.value = dbToGain(state.audio.buses[k].db);
        g.connect(master);
        state.audio.buses[k].gain = g;
      }

      state.audio.ctx = ctx;
      return ctx;
    }

    async function unlockAudio() {
      const ctx = ensureAudio();
      if (ctx.state !== 'running') await ctx.resume();
      state.audio.unlocked = true;
      toast(t('audioActivated'), 'ok');
      // Resume all audio choices that were made before the WebAudio context
      // was unlocked. Ambience is scene-driven; armed music starts the playlist.
      const sc = activeScene();
      if (sc) {
        const desired = (sc.ambienceBank || []).filter(layer => layer.on);
        for (const layer of desired) {
          setAmbienceLayer(layer.assetId, true, layer.volDb, layer.fadeSec).catch(() => {});
        }
        if (state.audio.music.armed && (sc.musicBank || []).length) {
          playMusic(sc.currentMusic || sc.musicBank[0]);
        }
      }
      // Preload SFX for the currently selected scene
      preloadSfxForScene(activeScene());
      // Plus: preload session "hot" SFX pads (if any)
      preloadHotSessionSfx();
      render();
    }

    async function preloadHotSessionSfx() {
      if (!state.audio.unlocked) return;
      if (!state.activeSessionId) return;
      const hotIds = new Set((state.sessionAssets || []).filter(x => (x.preload || 'warm') === 'hot').map(x => x.asset_id));
      if (hotIds.size === 0) return;
      const ctx = ensureAudio();
      const assets = state.library?.SFX || [];
      for (const id of hotIds) {
        if (state.audio.sfx.cache.has(id) || state.audio.sfx.loading.has(id)) continue;
        const asset = assets.find(a => a.id === id);
        if (asset) preloadSfxAsset(id, asset, ctx).catch(e => console.warn('Hot session SFX task failed', id, e));
      }
      // Hot preload is intentionally fire-and-forget: one unsupported codec must
      // never block the UI or scene activation.
    }

    function setMasterDb(db) {
      state.audio.master.db = db;
      if (state.audio.master.gain) {
        const ctx = state.audio.ctx;
        state.audio.master.gain.gain.cancelScheduledValues(ctx.currentTime);
        state.audio.master.gain.gain.linearRampToValueAtTime(dbToGain(db), ctx.currentTime + 0.03);
      }
      render();
    }

    function setBusDb(bus, db) {
      state.audio.buses[bus].db = db;
      const g = state.audio.buses[bus].gain;
      if (g) {
        const ctx = state.audio.ctx;
        g.gain.cancelScheduledValues(ctx.currentTime);
        g.gain.linearRampToValueAtTime(dbToGain(db), ctx.currentTime + 0.03);
      }
      render();
    }

    function createRoutedAudioElement(streamUrl) {
      const audioEl = new Audio();
      audioEl.src = streamUrl;
      audioEl.crossOrigin = 'anonymous';
      audioEl.preload = 'auto';
      return audioEl;
    }

    function stopAndDisconnect(node, fadeSec=0.5) {
      if (!node) return;
      const ctx = state.audio.ctx;
      const t0 = ctx.currentTime;
      try {
        node.gainNode.gain.cancelScheduledValues(t0);
        node.gainNode.gain.setValueAtTime(node.gainNode.gain.value, t0);
        node.gainNode.gain.linearRampToValueAtTime(0.0001, t0 + Math.max(0.05, fadeSec));
      } catch {}
      setTimeout(() => {
        try { node.audioEl.pause(); } catch {}
        try { node.srcNode.disconnect(); } catch {}
        try { node.gainNode.disconnect(); } catch {}
      }, (Math.max(0.05, fadeSec) * 1000) + 80);
    }

    async function playMusic(assetId) {
      if (!state.audio.unlocked) { toast(t('enableAudioFirst'), 'warn'); return; }
      const ctx = ensureAudio();
      const asset = (state.library?.Musik || []).find(a => a.id === assetId);
      if (!asset) {
        state.audio.music.status = 'unavailable';
        state.audio.music.error = 'Titel nicht verfügbar';
        render();
        return;
      }
      state.audio.music.status = 'loading';
      state.audio.music.error = null;
      render();

      const crossfade = state.audio.music.crossfadeSec;
      const t0 = ctx.currentTime;

      const audioEl = createRoutedAudioElement(asset.stream_url);
      const srcNode = ctx.createMediaElementSource(audioEl);
      const gainNode = ctx.createGain();
      gainNode.gain.value = 0.0001;

      srcNode.connect(gainNode);
      gainNode.connect(state.audio.buses.music.gain);

      // fade in
      gainNode.gain.setValueAtTime(0.0001, t0);
      gainNode.gain.linearRampToValueAtTime(1.0, t0 + Math.max(0.05, crossfade));

      // start
      try {
        await audioEl.play();
        state.audio.music.status = 'playing';
      } catch (e) {
        state.audio.music.status = 'unavailable';
        state.audio.music.error = 'Musik konnte nicht gestartet werden';
        toast(t('musicStartFailed'), 'warn');
      }

      // fade out old
      const prev = state.audio.music.node;
      audioEl.loop = state.audio.music.loopMode === 'track' || (state.audio.music.loopMode === 'off' && !!state.audio.music.loop);
      audioEl.addEventListener('ended', () => {
        // Ignore an old track that finished after a manual switch/crossfade.
        if (audioEl.loop || state.audio.music.node?.audioEl !== audioEl) return;

        const sc = activeScene();
        const bank = sc?.musicBank || [];
        const currentIndex = bank.indexOf(assetId);
        const nextAssetId = currentIndex >= 0 ? bank[currentIndex + 1] : null;

        if (nextAssetId) {
          // Playlist mode advances through the bank; after the last title it
          // wraps to the first one. Track mode is handled by audioEl.loop.
          playMusic(nextAssetId);
        } else if (state.audio.music.loopMode === 'playlist' && bank.length) {
          playMusic(bank[0]);
        } else {
          state.audio.music.status = 'idle';
          state.audio.music.node = null;
          render();
        }
      });
      state.audio.music.node = { assetId, audioEl, srcNode, gainNode };
      if (prev) stopAndDisconnect(prev, crossfade);

      // update scene currentMusic
      const sc = activeScene();
      if (sc) {
        sc.currentMusic = assetId;
        saveScene(sc, { quiet: true });
      }
      render();
    }

    function toggleMusic(assetId) {
      state.audio.music.armed = true;
      if (!state.audio.unlocked) {
        const sc = activeScene();
        if (sc) sc.currentMusic = assetId;
        render();
        toast(t('musicArmed'), 'info');
        return;
      }
      const current = state.audio.music.node;
      if (current?.assetId === assetId) {
        if (current.audioEl.paused) {
          current.audioEl.play().then(() => { state.audio.music.status = 'playing'; render(); }).catch(() => toast(t('musicResumeFailed'), 'warn'));
        } else {
          current.audioEl.pause();
          state.audio.music.status = 'paused';
          render();
        }
        return;
      }
      playMusic(assetId);
    }

    function toggleMusicLoop() {
      const modes = ['off', 'track', 'playlist'];
      const currentMode = state.audio.music.loopMode || (state.audio.music.loop ? 'track' : 'off');
      const nextMode = modes[(modes.indexOf(currentMode) + 1) % modes.length];
      state.audio.music.loopMode = nextMode;
      state.audio.music.loop = nextMode === 'track';
      const current = state.audio.music.node;
      if (current) current.audioEl.loop = nextMode === 'track';
      render();
    }

    function stopMusic() {
      const prev = state.audio.music.node;
      state.audio.music.node = null;
      state.audio.music.status = 'idle';
      if (prev) stopAndDisconnect(prev, state.audio.music.crossfadeSec);
      render();
    }

    async function setAmbienceLayer(assetId, on, volDb, fadeSec) {
      if (!state.audio.unlocked) { toast(t('enableAudioFirst'), 'warn'); return; }
      const ctx = ensureAudio();
      const asset = (state.library?.Ambience || []).find(a => a.id === assetId);
      if (!asset) return;
      // Per-layer boost: keep bus/master controls independent and cap the layer
      // at +12 dB to avoid uncontrolled gain escalation.
      const layerGainDb = clamp(Number(volDb) || 0, -40, 12);

      const nodes = state.audio.ambience.nodes;
      if (on) {
        if (nodes.has(assetId)) return;
        const t0 = ctx.currentTime;
        setAssetStatus('ambience', assetId, 'loading');
        const audioEl = createRoutedAudioElement(asset.stream_url);
        audioEl.loop = true;
        const srcNode = ctx.createMediaElementSource(audioEl);
        const gainNode = ctx.createGain();
        gainNode.gain.value = 0.0001;
        srcNode.connect(gainNode);
        gainNode.connect(state.audio.buses.ambience.gain);

        // fade in to target
        gainNode.gain.setValueAtTime(0.0001, t0);
        gainNode.gain.linearRampToValueAtTime(dbToGain(layerGainDb), t0 + Math.max(0.05, fadeSec));
        try {
          await audioEl.play();
          setAssetStatus('ambience', assetId, 'playing');
        } catch (e) {
          setAssetStatus('ambience', assetId, 'unavailable', 'Ambience konnte nicht gestartet werden');
          toast(t('ambienceStartFailed'), 'warn');
        }
        nodes.set(assetId, { assetId, audioEl, srcNode, gainNode });
      } else {
        const node = nodes.get(assetId);
        // Mark the layer inactive immediately, even while the fade-out is running.
        state.audio.ambience.status.set(assetId, 'idle');
        if (node) {
          nodes.delete(assetId);
          stopAndDisconnect(node, fadeSec);
        }
      }
      render();
    }

    function setAmbienceGain(assetId, volDb) {
      const node = state.audio.ambience.nodes.get(assetId);
      if (!node) return;
      const ctx = state.audio.ctx;
      node.gainNode.gain.cancelScheduledValues(ctx.currentTime);
      const layerGainDb = clamp(Number(volDb) || 0, -40, 12);
      node.gainNode.gain.linearRampToValueAtTime(dbToGain(layerGainDb), ctx.currentTime + 0.08);
    }

    // ---------------------- SFX: AudioBuffer preload + polyphonic playback ----------------------
    async function loadSfxAsset(asset, ctx) {
      const res = await fetch(asset.stream_url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const arr = await res.arrayBuffer();
      try {
        const buffer = await ctx.decodeAudioData(arr.slice(0));
        return { mode: 'buffer', buffer, updatedAt: Date.now() };
      } catch (decodeError) {
        // Some browsers can play Opus through HTMLAudioElement but cannot decode it
        // through WebAudio. Keep a blob URL as a safe, bus-routed fallback.
        const blob = new Blob([arr], { type: asset.mime_type || 'audio/ogg' });
        const url = URL.createObjectURL(blob);
        const probe = new Audio();
        probe.preload = 'metadata';
        probe.src = url;
        if (typeof probe.canPlayType === 'function' && !probe.canPlayType(asset.mime_type || 'audio/ogg')) {
          URL.revokeObjectURL(url);
          throw decodeError;
        }
        return { mode: 'element', url, updatedAt: Date.now() };
      }
    }

    async function preloadSfxAsset(id, asset, ctx) {
      if (state.audio.sfx.cache.has(id) || state.audio.sfx.loading.has(id)) return;
      state.audio.sfx.loading.add(id);
      setAssetStatus('sfx', id, 'loading');
      try {
        const loaded = await loadSfxAsset(asset, ctx);
        state.audio.sfx.cache.set(id, loaded);
        setAssetStatus('sfx', id, 'ready');
      } catch (e) {
        state.audio.sfx.errors.set(id, 'SFX konnte nicht geladen werden');
        setAssetStatus('sfx', id, 'unavailable', 'SFX konnte nicht geladen werden');
        console.warn('SFX preload failed', id, e);
      } finally {
        state.audio.sfx.loading.delete(id);
        render();
      }
    }

    async function preloadSfxForScene(sc) {
      if (!sc || !state.audio.unlocked) return;
      const ctx = ensureAudio();
      const ids = Array.from(new Set((sc.sfxBank || []).map(p => p.assetId)));
      const assets = state.library?.SFX || [];
      // Do not make scene activation wait for audio decoding.
      for (const id of ids) {
        const asset = assets.find(a => a.id === id);
        if (asset) preloadSfxAsset(id, asset, ctx).catch(e => console.warn('SFX task failed', id, e));
      }
    }

    function clearSfxVoice(assetId, voice) {
      if (!voice) return;
      try { voice.audioEl?.pause(); } catch {}
      try { voice.src?.stop?.(); } catch {}
      try { voice.src?.disconnect(); } catch {}
      try { voice.gain?.disconnect(); } catch {}
      if (voice.url) {
        try { URL.revokeObjectURL(voice.url); } catch {}
      }
      state.audio.sfx.playing.delete(assetId);
      state.audio.sfx.allVoices.delete(voice);
      endSfxDucking();
    }

    function stopSfx(assetId=null, { fadeSec=0.05 } = {}) {
      const voices = assetId
        ? Array.from(state.audio.sfx.allVoices).filter(v => v.assetId === assetId)
        : Array.from(state.audio.sfx.allVoices);
      for (const voice of voices) {
        const id = voice.assetId;
        if (!voice) continue;
        const ctx = state.audio.ctx;
        try {
          if (voice.gain && ctx) {
            const t = ctx.currentTime;
            voice.gain.gain.cancelScheduledValues(t);
            voice.gain.gain.setValueAtTime(Math.max(0.0001, voice.gain.gain.value), t);
            voice.gain.gain.linearRampToValueAtTime(0.0001, t + Math.max(0.01, fadeSec));
          }
        } catch {}
        setTimeout(() => {
          if (state.audio.sfx.voices.get(id) === voice) state.audio.sfx.voices.delete(id);
          if (state.audio.sfx.allVoices.has(voice)) {
            clearSfxVoice(id, voice);
            state.audio.sfx.status.set(id, 'ready');
            render();
          }
        }, Math.max(20, fadeSec * 1000 + 20));
      }
      if (!voices.length) render();
    }

    function stopAllSfx({ fadeSec=0.05 } = {}) {
      stopSfx(null, { fadeSec });
    }

    async function stopAllAmbience(sc, { fadeSec=0.05 } = {}) {
      if (!sc) return;
      for (const layer of (sc.ambienceBank || [])) layer.on = false;
      await saveScene(sc, { quiet: true });
      const activeNodes = Array.from(state.audio.ambience.nodes.values());
      state.audio.ambience.nodes.clear();
      for (const node of activeNodes) stopAndDisconnect(node, fadeSec);
      for (const [assetId] of state.audio.ambience.status) state.audio.ambience.status.set(assetId, 'aus');
      render();
    }

    function createSfxVoice(assetId, cached, ctx) {
      const out = state.audio.buses.sfx.gain;
      const voice = { assetId, mode: cached.mode, gain: null, src: null, audioEl: null, url: cached.mode === 'element' ? cached.url : null };
      state.audio.sfx.allVoices.add(voice);
      if (cached.mode === 'element') {
        const audioEl = new Audio(cached.url);
        audioEl.preload = 'auto';
        audioEl.crossOrigin = 'anonymous';
        const src = ctx.createMediaElementSource(audioEl);
        src.connect(out);
        voice.audioEl = audioEl;
        voice.src = src;
        audioEl.onended = () => {
          if (!state.audio.sfx.allVoices.has(voice)) return;
          if (state.audio.sfx.voices.get(assetId) === voice) state.audio.sfx.voices.delete(assetId);
          clearSfxVoice(assetId, voice);
          state.audio.sfx.status.set(assetId, 'bereit');
          render();
        };
        audioEl.play().catch(() => {
          if (!state.audio.sfx.allVoices.has(voice)) return;
          if (state.audio.sfx.voices.get(assetId) === voice) state.audio.sfx.voices.delete(assetId);
          clearSfxVoice(assetId, voice);
          setAssetStatus('sfx', assetId, 'unavailable', 'SFX konnte nicht gestartet werden');
        });
      } else {
        const t0 = ctx.currentTime;
        const src = ctx.createBufferSource();
        const g = ctx.createGain();
        src.buffer = cached.buffer;
        g.gain.value = 1.0;
        src.connect(g);
        g.connect(out);
        src.onended = () => {
          if (!state.audio.sfx.allVoices.has(voice)) return;
          if (state.audio.sfx.voices.get(assetId) === voice) state.audio.sfx.voices.delete(assetId);
          clearSfxVoice(assetId, voice);
          state.audio.sfx.status.set(assetId, 'bereit');
          render();
        };
        src.start(t0);
        voice.src = src;
        voice.gain = g;
      }
      return voice;
    }

    function triggerSfx(assetId) {
      if (!state.audio.unlocked) { toast(t('enableAudioFirst'), 'warn'); return; }
      const ctx = ensureAudio();
      const cached = state.audio.sfx.cache.get(assetId);
      if (!cached) {
        setAssetStatus('sfx', assetId, 'loading');
        toast(t('sfxLoading'), 'info');
        preloadSfxForScene(activeScene());
        return;
      }
      const pad = activeScene()?.sfxBank?.find(p => p.assetId === assetId);
      const mode = pad?.mode || 'poly';
      const current = state.audio.sfx.voices.get(assetId);
      if (mode === 'toggle' && current) { stopSfx(assetId); return; }
      if (mode === 'restart' && current) stopSfx(assetId, { fadeSec: 0.01 });
      const voice = createSfxVoice(assetId, cached, ctx);
      state.audio.sfx.voices.set(assetId, voice);
      state.audio.sfx.playing.add(assetId);
      beginSfxDucking();
      setAssetStatus('sfx', assetId, 'playing');
    }

    function stopAudio() {
      if (!state.audio.ctx) { toast(t('audioNotActive'), 'warn'); return; }
      stopAllAudio({ panicStop: false });
      toast(t('audioFadeStopped'), 'ok');
    }

    function panic() {
      if (!state.audio.ctx) { toast(t('audioNotActive'), 'warn'); return; }
      stopAllAudio({ panicStop: true });
      toast(t('emergencyStopped'), 'warn');
    }

    // ---------------------- Data helpers ----------------------
    function activeScene() {
      return state.scenes.find(s => s.id === state.activeSceneId) || null;
    }

    function groupedScenes() {
      const map = {};
      for (const s of state.scenes) (map[s.group || 'Allgemein'] ||= []).push(s);
      for (const k of Object.keys(map)) map[k].sort((a,b) => Number(a.order ?? 0) - Number(b.order ?? 0));
      return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
    }

    function sceneGroupColor(group) {
      const colors = ['#38bdf8', '#a78bfa', '#34d399', '#fbbf24', '#fb7185', '#2dd4bf', '#c084fc', '#f97316'];
      const explicit = state.scenes.find(s => (s.group || 'Allgemein') === group)?.groupColor;
      if (explicit) return explicit;
      let hash = 0;
      for (const char of String(group || 'Allgemein')) hash = ((hash << 5) - hash) + char.charCodeAt(0);
      return colors[Math.abs(hash) % colors.length];
    }

    function groupNames() { return [...new Set(state.scenes.map(s => s.group || 'Allgemein'))].sort((a,b) => a.localeCompare(b)); }
    function groupScenes() {
      const en = state.language === 'en';
      openDialog({ title: en ? 'New group' : 'Neue Gruppe', message: en ? 'Enter a name. A pastel color will be assigned automatically.' : 'Gib einen Namen ein. Eine Pastellfarbe wird automatisch vergeben.', input: true, requireValue: true, placeholder: en ? 'Group name' : 'Gruppenname', confirmText: en ? 'Create' : 'Erstellen', onSubmit: async (name) => {
        const next = String(name).trim();
        if (!next || groupNames().includes(next)) return;
        const color = ['#f9b4ab','#b8d8ba','#b8c0ff','#f7d6a3','#c6def1','#e8c7d8'][groupNames().length % 6];
        const base = activeScene() || state.scenes[0];
        if (!base) return;
        const copy = { ...base, id: `scene-${Math.random().toString(16).slice(2)}`, title: `${next}`, group: next, groupColor: color };
        const res = await API.upsertScene(copy); state.scenes.push(res.scene); state.activeSceneId = res.scene.id; render();
      } });
    }
    function openGroupEditor(existing) {
      const en = state.language === 'en';
      const current = state.scenes.find(s => (s.group || 'Allgemein') === existing);
      openDialog({ title: en ? 'Edit group' : 'Gruppe bearbeiten', message: en ? 'Change the name or choose a color.' : 'Ändere den Namen oder wähle eine Farbe.', input: true, color: current?.groupColor || sceneGroupColor(existing), requireValue: true, value: existing, placeholder: en ? 'Group name' : 'Gruppenname', confirmText: en ? 'Save' : 'Speichern', onSubmit: async (name, color) => { const next = String(name).trim(); if (!next || next === existing && color === current?.groupColor) return; for (const scene of state.scenes.filter(s => (s.group || 'Allgemein') === existing)) { scene.group = next; scene.groupColor = color; await saveScene(scene, { quiet: true }); } render(); } });
    }
    function deleteGroup(name) {
      const en = state.language === 'en';
      openDialog({ title: en ? 'Delete group' : 'Gruppe löschen', message: en ? `Delete “${name}” and all scenes in it?` : `„${name}“ und alle Szenen darin löschen?`, danger: true, confirmText: en ? 'Delete' : 'Löschen', onSubmit: async () => { const doomed = state.scenes.filter(s => (s.group || 'Allgemein') === name); for (const scene of doomed) await API.deleteScene(scene.id); state.scenes = state.scenes.filter(s => !doomed.includes(s)); if (doomed.some(s => s.id === state.activeSceneId)) state.activeSceneId = state.scenes[0]?.id || null; render(); } });
    }
    function assignSceneGroup(item) {
      const en = state.language === 'en';
      const groups = groupNames();
      openDialog({ title: en ? 'Assign group' : 'Gruppe zuweisen', message: en ? 'Choose an existing group.' : 'Wähle eine vorhandene Gruppe.', select: true, requireValue: true, value: item.group || groups[0] || '', options: groups.map(group => ({ value: group, label: group })), confirmText: en ? 'Save' : 'Speichern', onSubmit: async (group) => { item.group = String(group).trim(); await saveScene(item, { quiet: true }); render(); } });
    }

    async function persistSceneOrder(ordered) {
      // The backend stores one global integer order. Build that order from the
      // sidebar's group order so each group keeps a unique, stable sequence.
      const groups = groupedScenes().map(([group]) => group);
      const byGroup = new Map(groups.map(group => [group, []]));
      for (const scene of ordered) (byGroup.get(scene.group || 'Allgemein') || []).push(scene);
      const globalOrder = [];
      for (const group of groups) {
        const current = byGroup.get(group) || scenesInGroup(group);
        globalOrder.push(...current);
      }
      const updates = await Promise.all(globalOrder.map((scene, index) => API.reorderScene(scene.id, index)));
      const byId = new Map(updates.map(r => [r.scene.id, r.scene]));
      state.scenes = state.scenes.map(scene => byId.get(scene.id) || scene);
      state.ui.draggingSceneId = null;
      render();
    }

    function scenesInGroup(group) {
      return state.scenes.filter(s => (s.group || 'Allgemein') === group)
        .sort((a,b) => (Number(a.order ?? 0) - Number(b.order ?? 0)) || a.title.localeCompare(b.title));
    }

    async function reorderSceneWithinGroup(item, direction) {
      const group = item.group || 'Allgemein';
      const ordered = scenesInGroup(group);
      const index = ordered.findIndex(s => s.id === item.id);
      const targetIndex = index + direction;
      if (index < 0 || targetIndex < 0 || targetIndex >= ordered.length) return;
      const [moved] = ordered.splice(index, 1);
      ordered.splice(targetIndex, 0, moved);
      try { await persistSceneOrder(ordered); }
      catch (err) { state.ui.draggingSceneId = null; toast(`Reorder failed: ${err.message}`, 'warn'); render(); }
    }

    async function dropSceneOn(targetId) {
      const draggedId = state.ui.draggingSceneId;
      if (!draggedId || draggedId === targetId) return;
      const dragged = state.scenes.find(s => s.id === draggedId);
      const target = state.scenes.find(s => s.id === targetId);
      if (!dragged || !target || (dragged.group || 'Allgemein') !== (target.group || 'Allgemein')) return;
      const ordered = scenesInGroup(target.group || 'Allgemein');
      const from = ordered.findIndex(s => s.id === draggedId);
      const to = ordered.findIndex(s => s.id === targetId);
      if (from < 0 || to < 0) return;
      const [moved] = ordered.splice(from, 1);
      ordered.splice(to, 0, moved);
      try { await persistSceneOrder(ordered); }
      catch (err) { state.ui.draggingSceneId = null; toast(`Reorder failed: ${err.message}`, 'warn'); render(); }
    }

    function makeDefaultScene(gameId) {
      // A newly created game/session starts empty. Assets are added explicitly
      // by the user in the scene editor or session builder.
      return {
        id: `scene-${Math.random().toString(16).slice(2)}`,
        game_id: gameId,
        session_id: state.activeSessionId || null,
        title: t('newScene'),
        group: t('defaultGroup'),
        tags: [],
        musicBank: [],
        currentMusic: null,
        ambienceBank: [],
        sfxBank: [],
        sfxPadSize: 'large',
      };
    }

    async function saveScene(scene, { quiet=false } = {}) {
      try {
        const res = await API.upsertScene(scene);
        const saved = res.scene;
        // Keep the live scene object while controls are being edited. Replacing
        // it with a response can reset a just-changed select when another save
        // is still in flight.
        const current = state.scenes.find(s => s.id === saved.id);
        if (current && current !== scene) Object.assign(current, saved);
        else if (!current) state.scenes = [...state.scenes, saved];
        if (!quiet) toast(t('sceneSaved'), 'ok');
      } catch {
        if (!quiet) toast(t('saveFailed'), 'warn');
      }
      // Do not rebuild the DOM from inside a pad menu save. Rebuilding destroys
      // the native select/input interaction before the browser can finish it.
      if (!state.ui.openSfxPadMenu) render();
    }

    async function loadAll() {
      state.ui.busy = true; render();
      try {
        await API.health();
        state.connected = true;
        const g = await API.games();
        state.games = g.games || [];
        state.activeGameId = state.games[0]?.id || null;
        if (!state.activeGameId) {
          stopAllAudio({ panicStop: false });
          state.games = [];
          state.activeGameId = null;
          state.sessions = [];
          state.activeSessionId = null;
          state.sessionAssets = [];
          state.library = null;
          state.scenes = [];
          state.activeSceneId = null;
          state.ui.sessionBuilderOpen = false;
          state.ui.fullLibrary = null;
          state.ui.fullLibrarySelected = new Set();
          state.ui.selectedSessionAssets = new Set();
          state.ui.busy = false;
          render();
          return;
        }
        // Sessions
        const sessRes = await API.sessions(state.activeGameId);
        state.sessions = sessRes.sessions || [];
        state.activeSessionId = state.sessions[0]?.id || null;
        state.sessionAssets = [];
        if (state.activeSessionId) {
          const sa = await API.sessionAssets(state.activeSessionId);
          state.sessionAssets = sa.assets || [];
        }

        // Library is filtered by active session (if any)
        const libRes = await API.library(state.activeGameId, state.activeSessionId);
        state.library = libRes.library;

        // Scenes are filtered by their dedicated session_id field.
        const scenesRes = await API.scenes(state.activeGameId, state.activeSessionId);
        // Loading must never create a scene implicitly. A scene exists only
        // after the user explicitly creates it for an existing game.
        state.scenes = (scenesRes.scenes || []).filter(scene =>
          scene.game_id === state.activeGameId &&
          (!state.activeSessionId || scene.session_id === state.activeSessionId)
        );
        state.activeSceneId = state.scenes[0]?.id || null;
      } catch (e) {
        state.connected = false;
        toast(t('serverUnavailable'), 'warn');
      } finally {
        state.ui.busy = false;
        render();
      }
    }

    async function reloadActiveSession() {
      if (state.activeSessionId) {
        const sa = await API.sessionAssets(state.activeSessionId);
        state.sessionAssets = sa.assets || [];
      } else {
        state.sessionAssets = [];
      }
      const libRes = await API.library(state.activeGameId, state.activeSessionId);
      state.library = libRes.library;
      const scenesRes = await API.scenes(state.activeGameId, state.activeSessionId);
      state.scenes = scenesRes.scenes || [];
      state.activeSceneId = state.scenes[0]?.id || null;
      state.ui.selectedSessionAssets = new Set();
    }

    // ---------------------- Scene activation (apply audio state) ----------------------
    async function activateScene(sceneId) {
      // Clicking the already active scene must be a no-op. In particular, do
      // not restart the current music track or playlist from the beginning.
      if (String(sceneId) === String(state.activeSceneId)) return;
      // Stop the previous scene's music before switching. Music is an explicit
      // scene action and must never leak into, or appear active in, another scene.
      if (state.audio.music.node) stopMusic();
      state.activeSceneId = sceneId;
      render();
      const sc = activeScene();
      if (!sc || !state.audio.unlocked) return;

      // Preload SFX for the new scene, but do not start its music bank
      // automatically. Music starts only when the user presses Start.
      preloadSfxForScene(sc);

      // ambience: set desired
      const desired = new Map(sc.ambienceBank.filter(l => l.on).map(l => [l.assetId, l]));
      // stop those not desired
      for (const id of Array.from(state.audio.ambience.nodes.keys())) {
        if (!desired.has(id)) {
          const prevLayer = sc.ambienceBank.find(x => x.assetId === id);
          await setAmbienceLayer(id, false, prevLayer?.volDb ?? -20, prevLayer?.fadeSec ?? 3);
        }
      }
      // start desired
      for (const [id, l] of desired) {
        await setAmbienceLayer(id, true, l.volDb, l.fadeSec);
      }
    }

    // ---------------------- UI actions: edit banks ----------------------
    function addToMusicBank(assetId) {
      const sc = activeScene();
      if (!sc) return;
      if (!sc.musicBank.includes(assetId)) sc.musicBank.push(assetId);
      if (!sc.currentMusic) sc.currentMusic = assetId;
      saveScene(sc, { quiet: true });
      render();
    }

    function removeFromMusicBank(assetId) {
      const sc = activeScene();
      if (!sc) return;
      sc.musicBank = sc.musicBank.filter(id => id !== assetId);
      if (sc.currentMusic === assetId) sc.currentMusic = sc.musicBank[0] || null;
      saveScene(sc, { quiet: true });
      render();
    }

    function addAmbienceLayer(assetId) {
      const sc = activeScene();
      if (!sc) return;
      if (sc.ambienceBank.some(l => l.assetId === assetId)) return;
      sc.ambienceBank.push({ assetId, on: false, volDb: -20, fadeSec: 4 });
      saveScene(sc, { quiet: true });
      render();
    }

    function addSfxPad(assetId) {
      const sc = activeScene();
      if (!sc) return;
      if (sc.sfxBank.some(p => p.assetId === assetId)) return;
      const idx = sc.sfxBank.length;
      sc.sfxBank.push({ assetId, color: SWATCHES[idx % SWATCHES.length], key: String(idx + 1), mode: 'poly', label: '' });
      saveScene(sc, { quiet: true });
      render();
    }

    // ---------------------- Render ----------------------
    function renderSessionBuilder() {
      if (!state.activeSessionId) {

      if (!state.ui.fullLibrary) {
        state.ui.fullLibraryLoading = true;
        API.library(state.activeGameId, null).then((full) => {
          state.ui.fullLibrary = full.library || { Musik: [], Ambience: [], SFX: [] };

      const q = (state.ui.builderQuery || '').trim().toLowerCase();

      for (const b of ['Musik','Ambience','SFX']) {
        for (const a of (state.library?.[b] || [])) byId.set(a.id, a);
      }

      const rows = state.sessionAssets || [];
      const filtered = rows.filter(r => {
        if (!q) return true;
        const a = byId.get(r.asset_id);

        return hay.toLowerCase().includes(q);

      const reloadSessionAssets = async () => {

        render();

      const persistOrder = async () => {

        await reloadSessionAssets();

      };

      return el('div', { class: 'rounded-2xl border border-slate-800 bg-slate-900/20 overflow-hidden' }, [

          el('span', { class: 'font-semibold text-slate-200', text: `${rows.length} Assets` }),
          el('span', { text: `· ${fmtBytes(totalBytes)}` }),
          el('span', { text: selected.size ? `· ${selected.size} selected` : '' }),
          selected.size ? el('button', { class: 'px-2 py-1 rounded btn text-xs font-semibold text-rose-300', text: t('removeSelection'), onClick: async () => {
            try {
              for (const id of selected) await API.removeSessionAsset(state.activeSessionId, id);
              await reloadSessionAssets();
              const libRes = await API.library(state.activeGameId, state.activeSessionId);
              state.library = libRes.library;
            } catch (e) { toast(`Remove failed: ${e.message}`, 'warn'); }
          }}) : null,
          el('button', { class: 'px-2 py-1 rounded btn text-xs font-semibold', text: t('clearSelection'), onClick: () => { state.ui.selectedSessionAssets = new Set(); render(); } })
        ]),
        el('div', { class: 'px-3 py-2 border-b border-slate-800 flex items-center gap-2' }, [
          el('input', { class: 'flex-1 px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm', placeholder: t('searchSessionAssets'), 'aria-label': t('searchSessionAssets'), value: state.ui.builderQuery || '', onInput: (e) => { scheduleSearch('builder', e.target.value || '', (value) => { state.ui.builderQuery = value; }); } }),

        ]),

        state.ui.fullLibraryOpen ? renderFullLibraryPicker() : null,

        el('div', { class: 'divide-y divide-slate-800/70' },
          filtered.length ? filtered.map((r, idx) => {

            return el('div', { class: 'px-3 py-3 flex items-center gap-2 ' + (isSelected ? 'bg-emerald-950/20' : ''), draggable: true,
              onDragstart: () => { state.ui.draggingSessionAsset = r.asset_id; },
              onDragover: (e) => e.preventDefault(),
              onDrop: async (e) => {
                e.preventDefault();
                const from = (state.sessionAssets || []).findIndex(x => x.asset_id === state.ui.draggingSessionAsset);
                const to = (state.sessionAssets || []).findIndex(x => x.asset_id === r.asset_id);
                if (from < 0 || to < 0 || from === to) return;
                const next = [...state.sessionAssets]; const [moved] = next.splice(from, 1); next.splice(to, 0, moved);
                state.sessionAssets = next; state.ui.draggingSessionAsset = null;

              }
            }, [
              el('input', { type: 'checkbox', checked: isSelected, class: 'accent-emerald-500 shrink-0', onChange: (e) => { const next = new Set(selected); e.target.checked ? next.add(r.asset_id) : next.delete(r.asset_id); state.ui.selectedSessionAssets = next; render(); } }),
              el('span', { class: 'text-slate-500 cursor-grab select-none text-sm', text: t('sort'), title: t('dragToSort') }),
              el('div', { class: 'flex-1 min-w-0' }, [
                el('div', { class: 'text-sm font-semibold truncate', text: a?.filename || r.asset_id }),
                el('div', { class: 'text-[11px] text-slate-500 truncate', text: a?.rel_path || '' }),
                el('div', { class: 'mt-1 flex flex-wrap gap-1' }, [badge(r.preload || 'warm'), badge(`${Number(r.volume_db ?? 0).toFixed(1)} dB`), r.loop ? badge('loop') : null].filter(Boolean))
              ]),

              // volume
              el('input', { type: 'range', min: -40, max: 10, step: 1, value: Number(r.volume_db ?? 0), class: 'w-24 accent-emerald-500', onChange: async (e) => {
                try {
                  r.volume_db = Number(e.target.value);
                  await API.upsertSessionAssets(state.activeSessionId, { assets: [{ asset_id: r.asset_id, preload: r.preload, volume_db: r.volume_db, loop: r.loop, sort_order: r.sort_order }] });
                  const sa = await API.sessionAssets(state.activeSessionId);
                  state.sessionAssets = sa.assets || [];
                  toast(t('volumeSet'), 'ok');
                  render();
                } catch (err) {
                  toast(`Update failed: ${err.message}`, 'warn');
                }
              }}),

              // loop toggle
              el('button', { class: 'px-2.5 py-2 rounded-lg btn text-xs font-semibold', text: r.loop ? 'loop ✓' : 'loop', onClick: async () => {
                try {
                  r.loop = r.loop ? 0 : 1;
                  await API.upsertSessionAssets(state.activeSessionId, { assets: [{ asset_id: r.asset_id, preload: r.preload, volume_db: r.volume_db, loop: r.loop, sort_order: r.sort_order }] });
                  const sa = await API.sessionAssets(state.activeSessionId);
                  state.sessionAssets = sa.assets || [];
                  toast(t('loopUpdated'), 'ok');
                  render();

                  const sa = await API.sessionAssets(state.activeSessionId);
                  state.sessionAssets = sa.assets || [];
                  toast(t('preloadSet'), 'ok');
                  render();
                } catch (err) {
                  toast(`Update failed: ${err.message}`, 'warn');
                }
              } }, [
                el('option', { value: 'hot', text: 'hot', selected: (r.preload||'warm')==='hot' }),
                el('option', { value: 'warm', text: 'warm', selected: (r.preload||'warm')==='warm' }),
                el('option', { value: 'cold', text: 'cold', selected: (r.preload||'warm')==='cold' }),
              ]),

              el('button', { class: 'px-2.5 py-2 rounded-lg btn text-xs font-semibold text-rose-300 hover:text-rose-200', text: t('delete'), onClick: async () => {
                try {
                  await API.removeSessionAsset(state.activeSessionId, r.asset_id);
                  const sa = await API.sessionAssets(state.activeSessionId);
                  state.sessionAssets = sa.assets || [];
                  const libRes = await API.library(state.activeGameId, state.activeSessionId);
                  state.library = libRes.library;
                  toast(t('removed'), 'ok');
                  render();

                  toast(`Remove failed: ${e.message}`, 'warn');

              }})
            ]);
          }) : el('div', { class: 'px-3 py-6 text-sm text-slate-500' }, ['Keine Assets in dieser Session.'])
        )
      ]);
    }

    function renderFullLibraryPicker() {
      const full = state.ui.fullLibrary || { Musik: [], Ambience: [], SFX: [] };
      const bucket = state.ui.fullLibraryBucket || 'SFX';
      const q = (state.ui.fullLibraryQuery || '').trim().toLowerCase();

      const list = (full[bucket] || []).filter(a => {
        if (inSession.has(a.id)) return false;
        if (!q) return true;
        const hay = `${a.filename} ${a.rel_path}`.toLowerCase();
        return hay.includes(q);
      });

      const bucketBtn = (b, label) => el('button', {
        class: 'px-2.5 py-1.5 rounded-lg text-xs font-semibold border ' + (bucket === b ? 'bg-slate-800 border-slate-600 text-slate-100' : 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-900'),
        text: label,
        onClick: () => { state.ui.fullLibraryBucket = b; render(); }
      });

      const selectedLibrary = state.ui.fullLibrarySelected || new Set();
      const toggleLibrarySelection = (id) => {
        const next = new Set(selectedLibrary);
        next.has(id) ? next.delete(id) : next.add(id);
        state.ui.fullLibrarySelected = next;

      };
      const addSelectedLibraryAssets = async () => {
        const batch = Array.from(selectedLibrary).map((id, i) => ({ asset_id: id, preload: 'warm', sort_order: (state.sessionAssets?.length || 0) + i }));

        try {
          await API.upsertSessionAssets(state.activeSessionId, { assets: batch });
          const sa = await API.sessionAssets(state.activeSessionId);
          state.sessionAssets = sa.assets || [];
          state.ui.fullLibrarySelected = new Set();
          const libRes = await API.library(state.activeGameId, state.activeSessionId);

          toast(`${batch.length} Assets hinzugefügt`, 'ok');

      return el('div', { class: 'border-t border-slate-800 bg-slate-950/30' }, [

            el('div', { class: 'flex-1 min-w-0' }, [

              el('div', { class: 'text-[11px] text-slate-500 truncate', text: a.rel_path })
            ]),

              try {

                const sa = await API.sessionAssets(state.activeSessionId);
                state.sessionAssets = sa.assets || [];
                const libRes = await API.library(state.activeGameId, state.activeSessionId);
                state.library = libRes.library;
                toast(t('added'), 'ok');
                render();
              } catch (e) {
                toast(`Add failed: ${e.message}`, 'warn');
              }
            }})
          ]))
        ),
        list.length > 250 ? el('div', { class: 'px-3 py-2 text-[11px] text-slate-500' }, [`… ${list.length - 250} weitere (Suche eingrenzen)`]) : null,

      render();
      try {
        const res = await API.createGame({ name: cleanName });
        state.games = [res.game];

        state.sessions = [];
        state.activeSessionId = null;
        state.library = null;
        state.scenes = [];
        state.activeSceneId = null;
        state.ui.librarySetupComplete = true;
        state.ui.setupLibraryName = cleanName;
        toast(t('libraryCreated'), 'ok');
      } catch (e) {
        toast(`Bibliothek konnte nicht erstellt werden: ${e.message}`, 'warn');
      } finally {
        state.ui.busy = false;
        render();
      }
    }

    async function createGameFromSetup(name) {
      const cleanName = String(name ?? '').trim();
      if (!cleanName || !state.activeGameId) return;
      state.ui.busy = true;
      render();
      try {
        const res = await API.createSession({ game_id: state.activeGameId, title: cleanName });
        state.sessions = [res.session];
        state.activeSessionId = res.session.id;
        const sa = await API.sessionAssets(state.activeSessionId);
        state.sessionAssets = sa.assets || [];
        const libRes = await API.library(state.activeGameId, state.activeSessionId);
        state.library = libRes.library;
        state.scenes = [];
        state.activeSceneId = null;
        toast(t('gameCreated'), 'ok');
      } catch (e) {
        toast(`Spiel konnte nicht erstellt werden: ${e.message}`, 'warn');
      } finally {
        state.ui.busy = false;
        render();
      }
    }

          'data-focus-key': fieldKey,

          onInput: (e) => { if (isLibrary) state.ui.setupLibraryName = e.target.value; else state.ui.setupGameName = e.target.value; }
        });
        return input;
      };
      const libraryInput = makeNameInput(true);
      const gameInput = makeNameInput(false);
      const submitLibrary = () => {
        const value = libraryInput.value.trim();
        if (!value) { libraryInput.focus(); return; }
        createLibraryFromSetup(value);
      };
      const submitGame = () => {
        const value = gameInput.value.trim();
        if (!value) { gameInput.focus(); return; }
        createGameFromSetup(value);
      };
      libraryInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitLibrary(); } });
      gameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitGame(); } });

    function renderPad(sc, pad) {
      const a = (state.library?.SFX || []).find(x => x.id === pad.assetId);

      const padStatus = state.audio.sfx.status.get(pad.assetId) || (state.audio.sfx.cache.has(pad.assetId) ? 'ready' : 'notLoaded');
      const padStatusText = {
        loading: t('loadingShort'),
        playing: t('playing'),
        unavailable: t('unavailable'),
        ready: t('ready'),
        notLoaded: t('notLoaded'),

      const modeInfo = {
        poly: { icon: '✦', label: t('poly'), color: '#fbbf24', description: t('polyHint') },
        toggle: { icon: '◉', label: t('toggle'), color: '#34d399', description: t('toggleHint') },
        restart: { icon: '↻', label: t('restart'), color: '#fb7185', description: t('restartHint') },
      }[pad.mode] || { icon: '✦', label: t('poly'), color: '#fbbf24', description: t('polyHint') };
      const isSmallPad = sc?.sfxPadSize === 'small';
      // Size is controlled once per bank in renderSfxCard. The pad itself fills

          background: `linear-gradient(160deg, ${pad.color}, ${pad.color}cc)`,
          boxShadow: `0 10px 26px -10px ${pad.color}88`,
        },
        onClick: () => triggerSfx(pad.assetId)

        el('div', {
          class: 'text-3xl leading-none font-black drop-shadow',
          text: String(pad.key || '').toUpperCase() || '—',
          title: `${name} · ${modeInfo.description}`,
          'aria-label': `${name}, Shortkey ${String(pad.key || '').toUpperCase() || 'nicht belegt'}, Modus ${modeInfo.label}`

        el('div', { class: 'text-base leading-tight px-2 text-center drop-shadow', text: name }),
        el('div', {
          class: 'padSmall flex items-center gap-1.5 rounded px-2 py-1 bg-black/35 border',

          render();

          onInput: async (e) => {
            const nextKey = (e.target.value || '').slice(0,1).toLowerCase();
            const conflict = (sc.sfxBank || []).find(other => other !== pad && (other.key || '').toLowerCase() === nextKey);
            if (nextKey && conflict) {
              e.target.value = pad.key || '';
              toast(`Hotkey „${nextKey.toUpperCase()}“ ist bereits vergeben.`, 'warn');
              return;
            }
            pad.key = nextKey;
            state.ui.openSfxPadMenu = pad.assetId;
            scheduleSceneSave(sc, `hotkey:${pad.assetId}`);
          }
        }),
        el('button', {
          class: 'mt-2 w-full text-xs text-rose-300 hover:text-rose-200 text-left px-0.5',
          text: t('removePad'),
          onClick: async (e) => {
            e.stopPropagation();
            sc.sfxBank = sc.sfxBank.filter(p => p.assetId !== pad.assetId);
            await saveScene(sc, { quiet: true });
            render();
          }
        })
      ]);

      // Keep menu interactions inside the menu. The menu is rendered from
      // state.ui.openSfxPadMenu, so focus and select changes survive rerenders.
      menu.addEventListener('click', (e) => e.stopPropagation());
      return menu;
    }

    // ---------------------- Keyboard hotkeys ----------------------
    window.addEventListener('keydown', (e) => {
      const sc = activeScene();
      if (!sc) return;
      const k = (e.key || '').toLowerCase();
      if (k === ' ') {
        e.preventDefault();
        panic();
        return;
      }
      const pad = (sc.sfxBank || []).find(p => (p.key || '').toLowerCase() === k);
      if (pad) {
        e.preventDefault();
        triggerSfx(pad.assetId);
      }
    });

    // ---------------------- Boot ----------------------
    (async () => {
      await loadTranslations();
      await loadAll();
      render();
    })();
  </script>
</body>
</html>
